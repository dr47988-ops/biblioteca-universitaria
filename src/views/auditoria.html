<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría | Biblioteca Universitaria UTN</title>

  <style>
    :root {
      --azul: #123c56;
      --azul-claro: #176d8a;
      --fondo: #f2f6f9;
      --borde: #dce6ed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--fondo);
      color: #19384c;
    }

    header {
      background: var(--azul);
      color: white;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 22px;
      margin: 0 0 5px;
    }

    header p {
      font-size: 13px;
      margin: 0;
      color: #c7e0ed;
    }

    main {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 23px;
      box-shadow: 0 4px 18px rgba(20, 55, 80, 0.05);
    }

    .panel-cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .panel-cabecera h2 {
      margin: 0;
      font-size: 22px;
    }

    .filtro {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    select {
      padding: 10px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      font-size: 14px;
      background: white;
      color: #19384c;
    }

    button,
    .btn-enlace {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-claro {
      background: white;
      color: var(--azul);
    }

    .btn-principal {
      background: var(--azul-claro);
      color: white;
    }

    .tabla-contenedor {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e7edf1;
      font-size: 13px;
      vertical-align: top;
    }

    th {
      color: #567184;
      background: #f5f9fb;
    }

    .etiqueta {
      display: inline-block;
      background: #e5f3f8;
      color: #125e7d;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .etiqueta.fallo {
      background: #fde9e9;
      color: #a42c2c;
    }

    .etiqueta.aviso {
      background: #fff3d6;
      color: #8a5b00;
    }

    .mensaje {
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #e5f3f8;
    }

    .paginacion {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      font-size: 14px;
    }

    .oculto {
      display: none !important;
    }
  </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>

  <header>
    <div>
      <h1>📚 Biblioteca Universitaria</h1>
      <p>Universidad Técnica Nacional | Registro de auditoría</p>
    </div>

    <a class="btn-enlace btn-claro" href="/admin.html">
      Volver al panel
    </a>
  </header>

  <main id="contenido" class="oculto">

    <section class="panel">

      <div class="panel-cabecera">
        <h2>Registro de auditoría</h2>

        <div class="filtro">
          <label for="filtroTipo">Tipo de evento</label>
          <select id="filtroTipo">
            <option value="">Todos</option>
            <option value="LOGIN_EXITOSO">Inicio de sesión exitoso</option>
            <option value="LOGIN_FALLIDO">Inicio de sesión fallido</option>
            <option value="CAMBIO_ROL">Cambio de rol</option>
            <option value="CAMBIO_PERMISOS">Cambio de permisos</option>
            <option value="ACCESO_DENEGADO">Acceso denegado (403)</option>
          </select>
        </div>
      </div>

      <div
        id="mensajeAuditoria"
        class="mensaje oculto"
        role="status"
        aria-live="polite">
      </div>

      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Fecha y hora</th>
              <th>Evento</th>
              <th>Usuario</th>
              <th>IP</th>
              <th>Método</th>
              <th>Ruta</th>
              <th>Detalle</th>
            </tr>
          </thead>

          <tbody id="tablaAuditoria">
            <tr>
              <td colspan="7">Cargando registros...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="paginacion">
        <span id="infoPagina"></span>

        <div>
          <button class="btn-principal" id="btnAnterior">Anterior</button>
          <button class="btn-principal" id="btnSiguiente">Siguiente</button>
        </div>
      </div>

    </section>

  </main>

  <script src="/js/auditoria.js" defer></script>
</body>
</html>
